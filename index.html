<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101d36">
<title>EcE Hub</title>
<link rel="stylesheet" href="styles.css?v=14">
<link rel="stylesheet" href="home-redesign.css?v=1">
<link rel="stylesheet" href="home-community.css?v=1">
<link rel="stylesheet" href="home-streaks.css?v=1">
<link rel="stylesheet" href="global-search.css?v=1">
<link rel="stylesheet" href="community-profile-ui-polish.css?v=1">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">✦</div><div><div class="brand-name">EcE Hub</div><div class="brand-subtitle">Academic workspace</div></div></div>
    <nav class="sidebar-scroll" id="sidebarScroll">
      <button class="nav-item active" data-route="home"><span>⌂</span>Home</button>
      <div class="nav-section">MAIN</div>
      <button class="nav-item" data-route="classes"><span>▣</span>Classes</button>
      <button class="nav-item" data-route="library"><span>▤</span>Library</button>
      <button class="nav-item" data-route="explore"><span>◉</span>Explore</button>
      <button class="nav-item" data-route="quizzes"><span>◈</span>Quizzes</button>
      <button class="nav-item" data-route="builtin-flashcards"><span>▤⃞</span>Built-in Flashcards</button>
      <button class="nav-item" data-route="tools"><span>◫</span>Study Tools</button>
      <div class="nav-section">WORKSPACE</div>
      <button class="nav-item" data-route="flashcards"><span>▧</span>Flashcards</button>
      <button class="nav-item" data-route="notes"><span>☑</span>Notes</button>
      <div class="nav-section">ACCOUNT</div>
      <button class="nav-item" data-route="profile"><span>◉</span>Profile</button>
      <button class="nav-item" data-route="settings"><span>⚙</span>Settings</button>
    </nav>
    <div class="guest-card"><div><span>Local workspace</span></div><button id="resetData">Reset Data</button></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button type="button" class="menu-button" id="menuButton" aria-label="Open menu">☰</button>
      <div class="search" id="searchWrap">
        <span class="search-icon">⌕</span>
        <input id="globalSearch" type="search" placeholder="Search notes, sets, quizzes, PDFs..." autocomplete="off">
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-button" id="themeButton" aria-label="Toggle theme">☾</button>
        <button type="button" class="icon-button" id="helpButton" aria-label="Help">?</button>
        <div class="profile-divider"></div>
        <button type="button" class="profile" id="communityProfileButton" data-action="edit-profile" aria-label="Edit profile">
          <div class="community-profile-avatar" id="communityProfileAvatar"></div>
          <div class="profile-info"><span id="headerUsername"></span></div>
        </button>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="community-auth-fix.js?v=1"></script>
<script src="app.js?v=14"></script>
<script src="explore-games.js"></script>
<script src="logicgates-game.js?v=5"></script>
<script src="electronics-crossword.js"></script>
<script src="home-redesign.js?v=2"></script>
<script src="search-controller.js?v=2"></script>
<script src="search-book-open-fix.js?v=1"></script>
<script src="community-workspace-hotfix.js?v=1"></script>
<script src="community-set-api-fix.js?v=2"></script>
<script src="community-ui-fix.js?v=3"></script>
<script src="community-users-fix.js?v=3"></script>
<script src="community-action-interceptor.js?v=2"></script>
<script src="community-profile-fix.js?v=2"></script>
<script src="community-profile-v3.js?v=1"></script>
<script src="home-community.js?v=1"></script>
<script src="community-search-polish.js?v=1"></script>
<script src="community-classes.js?v=1"></script>
<script src="community-workspace.js?v=1"></script>
<script src="flashcard-visibility.js?v=1"></script>
<script src="classes-sets-fix.js?v=3"></script>
<script src="flashcards-page-cleanup.js?v=1"></script>
<script src="flashcards-render-stability.js?v=1"></script>
<script src="flashcards-initial-render-fix.js?v=1"></script>
<script src="home-streaks.js?v=3"></script>
</body>
</html>
